# Render Blueprint configuration for Semantic Graph Chat
# Deploy both Backend (FastAPI) and Frontend (Next.js) automatically on Render

services:
  # ── Backend Web Service (FastAPI + LangGraph) ──────────────────────
  - type: web
    name: semantic-graph-chat-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false  # Render will prompt you to enter your API key
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: ENVIRONMENT
        value: production

  # ── Frontend Web Service (Next.js 14) ─────────────────────────────
  - type: web
    name: semantic-graph-chat-frontend
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: semantic-graph-chat-backend
          property: host
